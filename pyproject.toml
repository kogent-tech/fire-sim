[project]
name = "fire-sim"
version = "0.1.0"
description = "Self-hosted Safe Withdrawal Rate / retirement Monte Carlo engine"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "xlrd>=2.0",
    "pyarrow>=16.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fire_sim*"]

[tool.ruff]
line-length = 100
